<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Long Việt Fert</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="Hệ thống quản lý kho Long Việt">

<!-- Icon / ứng dụng: các thẻ này nằm ở TRANG NGOÀI nên iPhone và Android đọc được (khác với trong Apps Script). -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Long Việt Fert">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  html, body { margin:0; height:100%; background:#2f6f4f; overflow:hidden; }
  /* vùng an toàn (tai thỏ/ thanh trạng thái): để màu xanh trùng với thanh đầu của ứng dụng */
  /* iframe là phần tử "thay thế": top+bottom KHÔNG làm nó giãn (sẽ chỉ cao 150px) -> phải đặt height rõ ràng (dvh = bỏ thanh địa chỉ động trên điện thoại) */
  #khung { position:fixed; left:0; top:env(safe-area-inset-top, 0px); width:100%; height:calc(100% - env(safe-area-inset-top, 0px));
           height:calc(100dvh - env(safe-area-inset-top, 0px)); border:0; background:#fff; }
  #cho { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         background:#fff; color:#2f6f4f; font:600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; z-index:2; transition:opacity .25s ease; }
  #cho img { width:92px; height:92px; border-radius:20px; box-shadow:0 6px 18px rgba(47,111,79,.25); }
  #cho .xoay { width:26px; height:26px; border:3px solid #cfe5d8; border-top-color:#2f6f4f; border-radius:50%; animation:quay .8s linear infinite; }
  #cho a { font-weight:600; font-size:13px; color:#2f6f4f; display:none; }
  #cho.xong { opacity:0; pointer-events:none; }
  @keyframes quay { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="cho">
  <img src="icons/icon-192.png" alt="Long Việt Fert">
  <div class="xoay" aria-hidden="true"></div>
  <div>Đang mở hệ thống...</div>
  <a id="mo-truc-tiep" href="#" target="_blank" rel="noopener">Mở thẳng không qua trang này</a>
</div>

<iframe id="khung" title="Long Việt Fert"
        allow="camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *; fullscreen *"></iframe>

<script>
  // ĐỊA CHỈ HỆ THỐNG (Apps Script, bản thật). Đổi ở ĐÂY nếu sau này đổi sang hệ thống khác (ví dụ bản Next.js).
  var UNG_DUNG = 'https://script.google.com/macros/s/AKfycby3PwyfKSFMwfEuEEd7kdtpm74e3PNNkiBR3s_mU9k8F22OX-NfmqK9a1Metv37rwm92Q/exec';

  // Chuyển tiếp tham số trên địa chỉ (vd ?trang=...) cho hệ thống; luôn dùng link SẠCH, không có /u/1/.
  var dich = UNG_DUNG + (location.search || '');
  var khung = document.getElementById('khung');
  var cho = document.getElementById('cho');
  var lienKet = document.getElementById('mo-truc-tiep');
  lienKet.href = dich;

  // Hệ thống Apps Script tải 2 lớp: vỏ của Google xong trước (sự kiện load của khung), nội dung thật có thể chậm thêm 5-30 giây.
  // Nếu tắt màn hình chờ ngay ở sự kiện load thì người dùng thấy MÀN TRẮNG. Vì vậy:
  //  (1) hệ thống gửi tín hiệu postMessage {lvWms:'san-sang'} khi đã vẽ xong -> tắt màn hình chờ đúng lúc;
  //  (2) dự phòng (bản hệ thống cũ chưa gửi tín hiệu / tín hiệu bị chặn): tắt sau 25 giây kể từ khi vỏ tải xong.
  function tatManHinhCho() { cho.classList.add('xong'); }

  // ---- GIỮ HỘ DỮ LIỆU GHI NHỚ CỦA HỆ THỐNG (03/10/2026) ----
  // Khung bên dưới chạy "credentialless" (ẩn danh với Google) nên bộ nhớ của hệ thống trong khung chỉ sống trong một lần mở trang.
  // Trang này giữ hộ các khóa lv_* (phiên đăng nhập, lựa chọn "Ghi nhớ đăng nhập", thông báo đã xem...) trong localStorage của chính nó.
  // Giao thức postMessage với hệ thống (xem "CAU NOI LUU TRU VOI TRANG BOC" trong JavaScript.html của lv-wms-appsscript):
  //   hệ thống -> trang này: {lvWms:'san-sang'} | {lvWms:'xin-luu-tru'} | {lvWms:'luu', k, v} | {lvWms:'xoa', k}
  //   trang này -> hệ thống: {lvWms:'luu-tru', du:{...}}  (chỉ trả lời đúng khung đã hỏi, đúng nguồn của nó)
  // An toàn: chỉ nhận từ khung Apps Script (nguồn *-script.googleusercontent.com) NẰM TRONG trang này (ev.source.top === window);
  // một trang/cửa sổ khác giữ tham chiếu tới trang này không lấy được dữ liệu.
  var KHOA_LUU = 'lvWmsLuuTru';
  function docLuuTru() { try { var o = JSON.parse(localStorage.getItem(KHOA_LUU) || '{}'); return (o && typeof o === 'object') ? o : {}; } catch (e) { return {}; } }
  function ghiLuuTru(o) { try { localStorage.setItem(KHOA_LUU, JSON.stringify(o)); } catch (e) {} }
  function khoaHopLe(k) { return typeof k === 'string' && /^lv_[\w.@-]{1,80}$/.test(k); }
  function tuKhungHeThong(ev) {
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin || '')) return false;
    try { return !!ev.source && ev.source.top === window && window.top === window; } catch (e) { return false; }
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d.lvWms !== 'string' || !tuKhungHeThong(ev)) return;
    if (d.lvWms === 'san-sang') { tatManHinhCho(); return; }
    if (d.lvWms === 'xin-luu-tru') { try { ev.source.postMessage({ lvWms: 'luu-tru', du: docLuuTru() }, ev.origin); } catch (e) {} return; }
    if (d.lvWms === 'luu' && khoaHopLe(d.k) && typeof d.v === 'string' && d.v.length <= 50000) {
      var o = docLuuTru();
      if (Object.keys(o).length < 80 || Object.prototype.hasOwnProperty.call(o, d.k)) { o[d.k] = d.v; ghiLuuTru(o); }
      return;
    }
    if (d.lvWms === 'xoa' && khoaHopLe(d.k)) { var o2 = docLuuTru(); delete o2[d.k]; ghiLuuTru(o2); }
  });

  // Khung "credentialless": tải hệ thống KHÔNG kèm cookie Google, nên Google không chuyển hướng theo tài khoản đang đăng nhập
  // (nguyên nhân lỗi "Rất tiếc, không thể mở tệp tại thời điểm này" với một số tài khoản). Chrome/Edge hỗ trợ; Safari/Firefox vốn đã
  // không gửi cookie bên thứ ba cho khung nhúng nên không cần.
  try { if ('credentialless' in khung) khung.credentialless = true; } catch (e) {}
  khung.addEventListener('load', function () { setTimeout(tatManHinhCho, 25000); });
  khung.src = dich;

  // Quá 15 giây vẫn đang chờ: hiện đường mở thẳng (mạng yếu hoặc trình duyệt chặn khung)
  setTimeout(function () { if (!cho.classList.contains('xong')) lienKet.style.display = 'block'; }, 15000);

  // Service worker rỗng: để Chrome Android cho "Cài đặt ứng dụng". Không lưu đệm gì (luôn lấy bản mới nhất).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
